    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%231D8A7A'/><text x='50%' y='50%' font-family='serif' font-size='65' fill='%23ECF8F8' dominant-baseline='central' text-anchor='middle'>T</text></svg>">
    <title>clouds of thoughts — tisha's space ♥︎</title>
  </head>
  <body style="overflow-y: auto;">
    <div class="mesh-bg"></div>
    <div id="bird-layer"></div>

    <div class="thoughts-container">
      <a href="index.html" class="back-link">&larr; back</a>

      <div class="thoughts-intro">
        <span class="sticker s1">☁️</span>
        <span class="sticker s2">✨</span>
        <span class="sticker s3">🎈</span>
        <span class="sticker s4">💭</span>
        <div class="badge">Clouds of Thoughts</div>
        <h1>Send a little cloud my way</h1>
        <p>A note, a memory, a joke, feedback on the site, anything — write it below and it'll drift up here once I've had a read.</p>
      </div>

      <!-- Replace this action URL with your own Formspree (or similar) endpoint -->
      <form class="thought-form" id="thought-form" action="https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID" method="POST">
        <input type="text" name="name" placeholder="Your name or handle" required>
        <textarea name="message" placeholder="Your thought..." required></textarea>
        <button type="submit">Send it up</button>
        <p class="form-note">Every cloud is reviewed before it floats onto the page.</p>
        <p class="form-status" id="form-status"></p>
      </form>

      <div class="sky" id="sky"></div>
    </div>

    <script src="thoughts-data.js"></script>
    <script>
      // Renders the approved thoughts from thoughts-data.js as clouds.
      const sky = document.getElementById('sky');
      APPROVED_THOUGHTS.forEach(t => {
        const card = document.createElement('div');
        card.className = 'cloud-card';
        const p = document.createElement('p');
        p.textContent = t.message;
        const from = document.createElement('div');
        from.className = 'from';
        from.textContent = '— ' + t.name;
        card.appendChild(p);
        card.appendChild(from);
        sky.appendChild(card);
      });

      // Basic fetch submit so the page doesn't redirect to Formspree on success.
      const form = document.getElementById('thought-form');
      const status = document.getElementById('form-status');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = 'Sending...';
        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            status.textContent = "Thank you — it's floating over to me.";
            form.reset();
          } else {
            status.textContent = 'Something went wrong. Try again in a bit?';
          }
        } catch (err) {
          status.textContent = 'Something went wrong. Try again in a bit?';
        }
      });
    </script>

    <script>
      // ----- shy little birds -----
      // A handful of small white birds drift slowly around the page and
      // scatter away from the cursor when it gets close, then settle back
      // into a gentle wander.
      (function () {
        const layer = document.getElementById('bird-layer');
        const BIRD_COUNT = 6;
        const FLEE_RADIUS = 130;
        const WANDER_SPEED = 0.35;
        const FLEE_SPEED = 3.2;

        const birdSvg = () =>
          '<svg width="30" height="16" viewBox="0 0 30 16" xmlns="http://www.w3.org/2000/svg">' +
          '<path class="wing" d="M0 8 Q7.5 0 15 8 Q22.5 0 30 8" fill="none" ' +
          'stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg>';

        const flapFrames = [
          'M0 8 Q7.5 0 15 8 Q22.5 0 30 8',   // wings up
          'M0 8 Q7.5 4 15 8 Q22.5 4 30 8',   // wings mid
          'M0 8 Q7.5 12 15 8 Q22.5 12 30 8', // wings down
          'M0 8 Q7.5 4 15 8 Q22.5 4 30 8'
        ];

        let mouseX = -9999, mouseY = -9999;
        window.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
          mouseX = -9999; mouseY = -9999;
        });

        const birds = [];
        for (let i = 0; i < BIRD_COUNT; i++) {
          const el = document.createElement('div');
          el.className = 'bird';
          el.innerHTML = birdSvg();
          layer.appendChild(el);

          birds.push({
            el,
            path: el.querySelector('.wing'),
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight * 0.7 + 20,
            vx: (Math.random() - 0.5) * WANDER_SPEED * 2,
            vy: (Math.random() - 0.5) * WANDER_SPEED,
            flapPhase: Math.random() * 4,
            flapTimer: 0
          });
        }

        function step() {
          const w = window.innerWidth;
          const h = window.innerHeight;

          birds.forEach((b) => {
            // gentle random wander
            b.vx += (Math.random() - 0.5) * 0.05;
            b.vy += (Math.random() - 0.5) * 0.05;

            // flee from cursor
            const dx = b.x - mouseX;
            const dy = b.y - mouseY;
            const dist = Math.hypot(dx, dy);
            if (dist < FLEE_RADIUS) {
              const force = (1 - dist / FLEE_RADIUS) * FLEE_SPEED;
              const ux = dx / (dist || 1);
              const uy = dy / (dist || 1);
              b.vx += ux * force;
              b.vy += uy * force;
            }

            // speed clamp + gentle damping back toward wander speed
            const speed = Math.hypot(b.vx, b.vy);
            const maxSpeed = dist < FLEE_RADIUS ? FLEE_SPEED : WANDER_SPEED * 1.6;
            if (speed > maxSpeed) {
              b.vx = (b.vx / speed) * maxSpeed;
              b.vy = (b.vy / speed) * maxSpeed;
            }
            b.vx *= 0.985;
            b.vy *= 0.985;

            b.x += b.vx;
            b.y += b.vy;

            // wrap around edges with a little padding
            if (b.x < -40) b.x = w + 40;
            if (b.x > w + 40) b.x = -40;
            if (b.y < 10) { b.y = 10; b.vy *= -1; }
            if (b.y > h - 20) { b.y = h - 20; b.vy *= -1; }

            // wing flap
            b.flapTimer++;
            if (b.flapTimer > 6) {
              b.flapTimer = 0;
              b.flapPhase = (b.flapPhase + 1) % flapFrames.length;
              b.path.setAttribute('d', flapFrames[b.flapPhase]);
            }

            const facingLeft = b.vx < 0;
            b.el.style.transform =
              'translate(' + b.x + 'px,' + b.y + 'px) scaleX(' + (facingLeft ? -1 : 1) + ')';
          });

          requestAnimationFrame(step);
        }

        requestAnimationFrame(step);
      })();
    </script>
  </body>
</html>
